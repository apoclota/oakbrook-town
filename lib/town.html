function route(from,to){
 const a=coords[from],b=coords[to];if(!a||!b)return []
 const r=blocks[from],s=blocks[to];if(r===s)return [a,b]
 const lanes=[[[95,28],[97,44],[95,59]],[[37,59],[37,74],[37,90]]]
 const path=[a]
 if(r<s){for(let k=r;k<s;k++)path.push(...lanes[k])}
 else {for(let k=r-1;k>=s;k--)path.push(...lanes[k].slice().reverse())}
 return [...path,b]
}
function along(path,t){
 if(!path.length)return null
 const lengths=path.slice(1).map((b,i)=>Math.hypot((b[0]-path[i][0])*1.5,b[1]-path[i][1]))
 let remaining=Math.min(1,Math.max(0,t))*lengths.reduce((a,b)=>a+b,0)
 for(let i=0;i<lengths.length;i++){if(remaining<=lengths[i]&&lengths[i]){let f=remaining/lengths[i];return path[i].map((a,k)=>a+f*(path[i+1][k]-a))}remaining-=lengths[i]}
 return path.at(-1)
}

const SPRITE_EXT=['png','webp','svg']
const userSprites=new Map()
function loadUserSprite(key,index,done){
  if(userSprites.has(key))return done(userSprites.get(key))
  const ext=SPRITE_EXT[index]
  if(!ext){userSprites.set(key,null);return done(null)}
  const probe=new Image()
  probe.onload=()=>{userSprites.set(key,spriteRoot+key+'.'+ext);done(userSprites.get(key))}
  probe.onerror=()=>loadUserSprite(key,index+1,done)
  probe.src=spriteRoot+key+'.'+ext
}
function spriteEl(key,w,h){
  const model=MODELS[key]||MODELS.box,node=el('div')
  node.className='sprite';node.dataset.sprite=key
  node.style.width=(w||model.w)+'px';node.style.height=(h||model.h)+'px'
  node.innerHTML=model.svg
  loadUserSprite(key,0,src=>{
    if(!src)return
    const img=document.createElement('img');img.src=src;img.alt=''
    img.style.cssText='width:100%;height:100%;object-fit:contain;display:block'
    img.onerror=()=>{node.innerHTML=model.svg}
    node.replaceChildren(img)
  })
  return node
}

function hearts(count){
  const filled=Math.max(0,Math.min(5,Number(count)||0))
  return '♥'.repeat(filled)+'♡'.repeat(5-filled)
}
function affinityEl(affinity){
  const wrap=el('span');wrap.className='affinity'
  if(!affinity){wrap.append(el('span','初次见面'));return wrap}
  const bar=el('span');bar.className='bar'
  const fill=document.createElement('i');fill.style.width=Math.round(Math.max(0,Math.min(1,Number(affinity.progress)||0))*100)+'%'
  bar.append(fill)
  wrap.append(el('span',(affinity.label||'初识')+' '+hearts(affinity.hearts)),bar)
  return wrap
}

function spriteGuess(name){
  const label=String(name||'')
  for(const [pattern,key] of SPRITE_RULES) if(pattern.test(label)) return key
  return 'box'
}
let mapUrl, mapRequest
function showMapImage(image){
 if(mapUrl){if(!image.hasAttribute('src'))image.src=mapUrl;return}
 if(!mapRequest)mapRequest=fetch('/oakbrook.webp').then(r=>{
   if(!r.ok)throw Error('地图加载失败')
   return r.blob()
 }).then(blob=>{
   mapUrl=URL.createObjectURL(blob)
   if(!roomOpen)image.src=mapUrl
 }).catch(()=>{$('notice').textContent='地图加载失败，正在重试'}).finally(()=>{mapRequest=null})
}
const view=$('viewport')
view.onwheel=e=>{if(!e.ctrlKey&&!e.shiftKey)return;e.preventDefault();zoom(Number($('zoom').value)+(e.deltaY<0?25:-25))}
let pan
view.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button===0)pan=[e.clientX,e.clientY,view.scrollLeft,view.scrollTop]}
view.onpointermove=e=>{if(!pan||!e.buttons)return;const dx=e.clientX-pan[0],dy=e.clientY-pan[1];if(Math.abs(dx)+Math.abs(dy)>5){view.setPointerCapture(e.pointerId);view.scrollLeft=pan[2]-dx;view.scrollTop=pan[3]-dy}}
window.addEventListener('pointerup',()=>pan=null)
function draw(){
 const locs=state.locations||[],here=state.location?.id
 const place=locs.find(x=>x.id===selected)||locs.find(x=>x.id===here)||locs[0]
 $('pins').replaceChildren()
 const trip=state.travel?.inProgress
 if(!roomOpen){
 locs.forEach((p,i)=>{const pt=coords[p.id]||[8+i*4,96];const b=button('',()=>select(p.id));b.append(el('span',p.name));b.className='hit';b.setAttribute('aria-pressed',p.id===place?.id);position(b,...pt);$('pins').append(b)})
 const path=trip?route(trip.from,trip.to):selected&&selected!==here?route(here,selected):[]
 if(path.length){
   const ns='http://www.w3.org/2000/svg',overlay=document.createElementNS(ns,'svg'),line=document.createElementNS(ns,'polyline')
   overlay.setAttribute('viewBox','0 0 150 100');overlay.setAttribute('preserveAspectRatio','none');overlay.setAttribute('aria-hidden','true');overlay.classList.add('route')
   line.setAttribute('points',path.map(([x,y])=>(x*1.5)+','+y).join(' '));overlay.append(line);$('pins').prepend(overlay)
 }
 const pos=trip?along(path,Number(trip.progress)||0):coords[here]

function roomIdOf(rooms,name){const room=(rooms||[]).find(r=>r.name===name||r.id===name);return room?room.id:null}
function roomAt(rooms,x,y){
  const list=rooms||[]
  const hit=list.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)
  if(hit)return hit.name
  let best=list[0],bestD=Infinity
  for(const r of list){const dx=x-(r.x+r.w/2),dy=y-(r.y+r.h/2),d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=r}}
  return best?best.name:'客厅'
}

  }
  if(pendingItem&&inside){
    $('notice').textContent='点平面图上想放的位置：'+pendingItem.name
    stage.onclick=e=>{
      if(e.target.closest('.furniture'))return
      const b=stage.getBoundingClientRect()
      const x=Math.max(2,Math.min(98,Math.round((e.clientX-b.left)/b.width*100)))
      const y=Math.max(2,Math.min(98,Math.round((e.clientY-b.top)/b.height*100)))
      const item=pendingItem;pendingItem=null;stage.onclick=null
      run({kind:'decorate',id:place.id,item:item.id,decorAction:'place',room:roomAt(home.rooms,x,y),x,y})
    }
  } else stage.onclick=null
}
function homePanel(d,place,inside){

  card.append(head)
  const bar=el('div');bar.className='bar';const fill=document.createElement('i')
  fill.style.width=Math.round((Number(comfort.progress)||0)*100)+'%';bar.append(fill);card.append(bar)
  card.append(el('small',comfort.note||''))
  card.append(el('small',home.visitor?('👋 '+home.visitor.name+'正在做客，'+(home.visitor.line||'')):('邻居串门概率约 '+(home.visitCeiling||0)+'%，舒适度越高越常来。')))

  const tabs=el('div');tabs.className='room-tabs'
  const all=button('全部',()=>{activeRoom=null;draw()});if(!activeRoom)all.className='on';tabs.append(all)
  for(const room of home.rooms){const b=button(room.name,()=>{activeRoom=room.id;draw()});if(activeRoom===room.id)b.className='on';tabs.append(b)}
  d.append(tabs)
  const items=home.items.filter(item=>!activeRoom||roomIdOf(home.rooms,item.room)===activeRoom)
  d.append(el('h3','已有家具 · '+items.length+' 件'))
  if(!items.length)d.append(el('small','这间还空着，去家具行挑一件。'))

    const row=el('div');row.className='furn-row'
    row.append(spriteEl(item.sprite||spriteGuess(item.name),26,26),el('span',item.name+' · '+(item.room||'小屋')+' · +'+(item.comfort||0)))
    if(inside){
      row.append(button('旋转',()=>run({kind:'decorate',id:place.id,item:item.instanceId||item.id,decorAction:'rotate',rotation:(Number(item.rotation)||0)+15})))
      row.append(button('收回',()=>run({kind:'decorate',id:place.id,item:item.instanceId||item.id,decorAction:'remove'})))
    }
    d.append(row)
  }
  const owned=(state.inventory||[]).filter(item=>item.decor)
  d.append(el('h3','随身可布置 · '+owned.length+' 件'))
  if(!owned.length)d.append(el('small','背包里没有家具，商店买来的沙发、灯、地毯都能布置。'))
  for(const item of owned){
    const row=el('div');row.className='furn-row owned'
    row.append(spriteEl(item.sprite||spriteGuess(item.name),26,26),el('span',item.name))
    if(inside){const b=button('布置',()=>{pendingItem=item;draw()});row.append(b)}
    d.append(row)
  }
  if(inside){
    yardPanel(d,place,inside)
    const acts=el('div');acts.className='choices'
    for(const action of ['在客厅歇一会儿','在小书桌写日记','给窗边的花浇水']){
      const b=button(action,()=>run({kind:'act',id:place.id,action}));b.disabled=busy;acts.append(b)
    }
    d.append(acts)
  }
}
function giftBox(npc,place){
  const box=el('div');box.className='choices'
  const items=(state.inventory||[]).slice(-3)
  if(!items.length){box.append(el('small','背包里还没有可以送出的东西。'));return box}
  box.append(el('small','送点什么给'+npc.name+'：'))
  for(const item of items){
    const b=button('赠送'+item.name,()=>run({kind:'npc-gift',id:place.id,npcId:npc.id,item:item.id}))
    b.disabled=busy;box.append(b)
  }
  return box
}
const shelfPage={}
function drawShelf(stage,shop,closed,onItem){
  const items=shop.items||[]
  const perPage=15,pages=Math.max(1,Math.ceil(items.length/perPage))
  const page=Math.min(pages-1,Math.max(0,shelfPage[shop.id]||0));shelfPage[shop.id]=page
  const wrap=el('div');wrap.className='shelf'+(closed?' closed':'')
  const head=el('div');head.className='shelf-head'
  head.append(el('strong','展示柜 · '+(shop.name||'小店')),el('small','共 '+items.length+' 件'+(closed?'　·　已打烊，明天再来':'')))
  wrap.append(head)
  const body=el('div');body.className='shelf-body'
  const slice=items.slice(page*perPage,(page+1)*perPage)
  for(let r=0;r<3;r++){
    const row=el('div');row.className='shelf-row'
    for(let c=0;c<5;c++){
      const item=slice[r*5+c]
      const cell=el('button');cell.className='cell'
      if(!item){cell.classList.add('empty');cell.disabled=true;row.append(cell);continue}
      cell.append(spriteEl(item.sprite||spriteGuess(item.name),34,34),el('small',item.name),el('b',item.price+' 币'))
      if(closed)cell.classList.add('shut')
      cell.onclick=()=>onItem(item)
      row.append(cell)
    }
    body.append(row)
  }
  wrap.append(body)
  if(pages>1){const foot=el('div');foot.className='shelf-foot';foot.append(button('◀ 上一格',()=>{shelfPage[shop.id]=page-1;draw()}),el('small',(page+1)+' / '+pages),button('下一格 ▶',()=>{shelfPage[shop.id]=page+1;draw()}));wrap.append(foot)}
  stage.append(wrap)
}
function openTV(item,id,place){
  const panel=$('object-panel')
  panel.replaceChildren(el('strong','旧电视'),el('small','正在拉节目单…'))
  fetch('/tv').then(r=>r.json()).catch(()=>({ok:false,videos:[]})).then(feed=>{
    panel.replaceChildren()
    const head=el('div');head.className='card-head';head.append(spriteEl('tv',62,62))
    const meta=el('div');meta.className='card-meta';meta.append(el('strong','旧电视'))
    meta.append(el('small',feed.source==='local'?'镇上点播台 · B 站暂时没信号':('节目单来自 B 站 · 刚刚拉的')))
    head.append(meta);panel.append(head)
    const list=el('div');list.className='tv-list'
    for(const v of (feed.videos||[]).slice(0,6)){
      const card=el('div');card.className='tv-card'
      card.append(el('b',v.title),el('small',[v.author,v.duration,v.views?('播放 '+Math.round(v.views/10000)+' 万'):''].filter(Boolean).join(' · ')))
      if(v.desc)card.append(el('small',v.desc))
      const acts=el('div');acts.className='choices'
      const w=button('在电视上看 20 分钟',()=>run({kind:'watch-tv',id:place.id,video:{bvid:v.bvid,title:v.title,url:v.url}}));w.className='primary';acts.append(w)
      if(v.url)acts.append(button('在新标签打开',()=>window.open(v.url,'_blank','noopener')))

}
function drawRoom(place,inside){
 const stage=$('stage'),panel=$('object-panel'),cell=cells[place.id]
 stage.classList.remove('plan');stage.replaceChildren();panel.replaceChildren();if(stage.dataset.scene!==place.id){stage.dataset.scene=place.id;stage.style.backgroundImage='url('+sceneRoot+place.id+'.webp)'
   const probe=new Image();probe.onerror=()=>{missingScenes.add(place.id);if(stage.dataset.scene===place.id&&!stage.querySelector('.scenemissing')){const tip=el('div');tip.className='scenemissing';tip.textContent='这个地点还没有场景画 · 把 '+place.id+'.webp 放进 lib/scenes/ 就会显示';stage.append(tip)}};probe.src=sceneRoot+place.id+'.webp'}
 if(missingScenes.has(place.id)&&!stage.querySelector('.scenemissing')){const tip=el('div');tip.className='scenemissing';tip.textContent='这个地点还没有场景画 · 把 '+place.id+'.webp 放进 lib/scenes/ 就会显示';stage.append(tip)}
 const commands=activities[place.id]||['在附近走走']
 const shop=state.shops?.find(s=>(s.locationId||s.id)===place.id)
 const dispatch=(kind,extra)=>run({kind,id:place.id,...extra})
 const closed=!!(state.openHours&&state.openHours[place.id]===false)
 function itemCard(item){
  inspected=null;panel.replaceChildren()
  const head=el('div');head.className='card-head';head.append(spriteEl(item.sprite||spriteGuess(item.name),66,66))
  const meta=el('div');meta.className='card-meta'
  meta.append(el('strong',item.name),el('small',item.price+' 镇币'+(item.comfort?'　舒适 +'+item.comfort:'')+(item.energy?'　精力 +'+item.energy:'')+(item.mood?'　心情 +'+item.mood:'')))
  if(item.decor)meta.append(el('small','家具 · 买回小屋可以布置'))
  if(item.seed)meta.append(el('small','种子 · 种到小院'))
  if(item.food||item.energy)meta.append(el('small','吃的 · 回一点精力和心情'))
  head.append(meta);panel.append(head)
  if(inside){const bb=button(closed?'打烊了':'买下 · '+item.price+' 镇币',()=>dispatch('buy',{item:item.id}));bb.className='primary';if(closed){bb.disabled=true;bb.title='这家店已经打烊了，明天再来'}panel.append(bb)}
  else panel.append(el('small','走进店里才能买'))
  panel.append(button('放回去',()=>panel.replaceChildren()))
 }
 function show(index){
  inspected=index;panel.replaceChildren()
  const prop=objects[cell]?.[index];if(!prop)return
  panel.append(el('strong',prop[0]+'　'))
  const action=commands[index]
  if(inside&&action)panel.append(button(action,()=>dispatch('act',{action})))
  if(!inside)panel.append(el('span','地点预览'))
 }
 if(shop)drawShelf(stage,shop,closed,itemCard)
 else for(const [index,[name,x,y]] of (objects[cell]||[]).entries()){
  const n=button(name,()=>show(index));n.className='prop';position(n,x,y);stage.append(n)
 }
 if(inspected!==null)show(inspected)
 const bottomY=shop?26:85
 if(inside){const n=el('span');n.className='person';n.append(avatar());position(n,shop?87:49,bottomY);stage.append(n)}
 for(const [index,npc] of (state.npcs||[]).filter(n=>n.locationId===place.id).entries()){
  const n=button(npc.name,()=>{panel.replaceChildren(el('span',npc.activity||npc.name));if(inside)panel.append(button('聊几句',()=>dispatch('npc-talk',{npcId:npc.id,text:'在'+place.name+'见面'})))})
  n.className='prop';position(n,18+index*16,bottomY);stage.append(n)
 }
 if(place.id!=='fish-home')return
 for(const item of state.homeDecor||[]){
   const id=item.instanceId||item.id
   const n=button('',()=>{});n.append(spriteEl(item.sprite||spriteGuess(item.name)))
   n.title=item.name;n.setAttribute('aria-label',item.name);n.className='furniture';position(n,item.x??50,item.y??50)
   n.style.transform='translate(-50%,-50%) rotate('+(Number(item.rotation)||0)+'deg)'
   stage.append(n);if(!inside)continue
   let start=null
   n.onpointerdown=e=>{if(busy)return;dragging=true;start=[e.clientX,e.clientY];n.setPointerCapture(e.pointerId)}
   function point(e){const b=stage.getBoundingClientRect();return [Math.round((e.clientX-b.left)/b.width*100),Math.round((e.clientY-b.top)/b.height*100)].map(v=>Math.max(2,Math.min(98,v)))}
   n.onpointermove=e=>{if(start)position(n,...point(e))}
   n.onpointerup=e=>{if(!start)return;const moved=Math.hypot(e.clientX-start[0],e.clientY-start[1])>4;dragging=false;start=null;if(moved){const [x,y]=point(e);dispatch('decorate',{item:id,decorAction:'move',room:item.room,x,y})}else{panel.replaceChildren(el('span',item.name),button('旋转',()=>dispatch('decorate',{item:id,decorAction:'rotate',rotation:(item.rotation||0)+15})),button('收回',()=>dispatch('decorate',{item:id,decorAction:'remove'})))}}
   n.onpointercancel=()=>{start=null;dragging=false;draw()}
 }
}
async function run(payload){if(busy)return;busy=true;revision++;draw();try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const v=await r.json();if(!r.ok)throw Error(v.error);state=v;$('notice').textContent=v.noticeText||('已记录'+({travel:'本次步行',buy:'本次购买',act:'本次活动',work:'工作',decorate:'房屋布置','npc-talk':'聊天','npc-gift':'送礼'}[payload.kind]||'操作'))}catch(e){$('notice').textContent=e.message}finally{busy=false;draw()}}
async function poll(){const version=revision;try{if(busy||dragging)return;const r=await fetch('/state');if(!r.ok)throw Error();const next=await r.json();if(version!==revision||dragging)return;if(JSON.stringify(next)!==JSON.stringify(state)){state=next;draw()}$('sync').textContent='● 已同步 '+new Date().toLocaleTimeString()}catch{$('sync').textContent='连接中断 · 正在重试'}finally{setTimeout(poll,Math.max(1,Number(window.TOWN_REFRESH_SECONDS||2))*1000)}}poll()
